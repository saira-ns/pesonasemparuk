<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Admin — Semparuk Kuala</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <main class="login-wrapper">

        <div class="login-card">

            <!-- LOGO -->
            <div class="login-logo">

                <div class="login-mark">
                    SK
                </div>

                <div>
                    <strong>WEBSITE DESA</strong>
                    <span>Semparuk Kuala</span>
                </div>

            </div>


            <!-- JUDUL -->
            <div class="login-heading">

                <span class="eyebrow">
                    ADMINISTRATOR
                </span>

                <h1>
                    Login Admin
                </h1>

                <p>
                    Masuk untuk mengelola pengaduan
                    dan pesan masyarakat.
                </p>

            </div>


            <!-- FORM LOGIN -->
            <form id="loginForm">

                <div class="login-form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Masukkan username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="login-form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Masuk ke Admin
                    <span>→</span>
                </button>


                <p
                    id="loginStatus"
                    class="login-status"
                ></p>

            </form>


            <!-- KEMBALI -->
            <a
                href="index.html"
                class="back-home"
            >
                ← Kembali ke website
            </a>

        </div>

    </main>


    <!-- LOGIN SCRIPT -->
    <script>

        /* =========================================
           GOOGLE APPS SCRIPT
           URL DEPLOYMENT TERBARU
        ========================================= */

        const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbwiFekXNS2naIya8pPjoScS424VBe4sZxllf2VEU3-un4UshPAyrZED2afYIEV-idjJ/exec";


        /* =========================================
           ELEMENT
        ========================================= */

        const loginForm =
        document.getElementById("loginForm");

        const loginStatus =
        document.getElementById("loginStatus");

        const loginButton =
        document.getElementById("loginButton");


        /* =========================================
           PROSES LOGIN
        ========================================= */

        loginForm.addEventListener(
            "submit",
            async function(e){

                e.preventDefault();


                const username =
                document.getElementById("username")
                .value
                .trim();


                const password =
                document.getElementById("password")
                .value
                .trim();


                /* ---------------------------------
                   VALIDASI
                --------------------------------- */

                if(!username || !password){

                    loginStatus.textContent =
                    "Username dan password wajib diisi.";

                    loginStatus.className =
                    "login-status error";

                    return;

                }


                /* ---------------------------------
                   TAMPILAN LOADING
                --------------------------------- */

                loginStatus.textContent =
                "Memeriksa login...";

                loginStatus.className =
                "login-status";


                loginButton.disabled = true;

                loginButton.innerHTML =
                'Memeriksa... <span>⏳</span>';


                /* ---------------------------------
                   DATA LOGIN
                --------------------------------- */

                const data =
                new URLSearchParams();


                data.append(
                    "action",
                    "login"
                );


                data.append(
                    "username",
                    username
                );


                data.append(
                    "password",
                    password
                );


                /* ---------------------------------
                   KIRIM KE APPS SCRIPT
                --------------------------------- */

                try{

                    const response =
                    await fetch(
                        SCRIPT_URL,
                        {
                            method:"POST",
                            body:data
                        }
                    );


                    const result =
                    await response.json();


                    /* ---------------------------------
                       LOGIN BERHASIL
                    --------------------------------- */

                    if(result.success){

                        sessionStorage.setItem(
                            "adminLogin",
                            "true"
                        );


                        sessionStorage.setItem(
                            "adminUsername",
                            username
                        );


                        loginStatus.textContent =
                        "Login berhasil. Membuka admin...";


                        loginStatus.className =
                        "login-status success";


                        loginButton.innerHTML =
                        'Berhasil <span>✓</span>';


                        setTimeout(
                            function(){

                                window.location.href =
                                "admin.html";

                            },
                            700
                        );


                    }


                    /* ---------------------------------
                       LOGIN GAGAL
                    --------------------------------- */

                    else{

                        loginStatus.textContent =
                        result.message ||
                        "Username atau password salah.";

                        loginStatus.className =
                        "login-status error";


                        loginButton.disabled = false;

                        loginButton.innerHTML =
                        'Masuk ke Admin <span>→</span>';

                    }


                }


                /* ---------------------------------
                   ERROR KONEKSI
                --------------------------------- */

                catch(error){

                    console.error(
                        "Login error:",
                        error
                    );


                    loginStatus.textContent =
                    "Terjadi kesalahan koneksi. Coba lagi.";

                    loginStatus.className =
                    "login-status error";


                    loginButton.disabled = false;

                    loginButton.innerHTML =
                    'Masuk ke Admin <span>→</span>';

                }

            }
        );

    </script>

</body>
</html>
