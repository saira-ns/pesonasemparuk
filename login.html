<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Admin — Semparuk Kuala</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <main class="login-wrapper">

        <div class="login-card">

            <!-- LOGO -->
            <div class="login-logo">
                <div class="login-mark">SK</div>

                <div>
                    <strong>WEBSITE DESA</strong>
                    <span>Semparuk Kuala</span>
                </div>
            </div>


            <!-- JUDUL -->
            <div class="login-heading">

                <span class="eyebrow">
                    ADMINISTRATOR
                </span>

                <h1>
                    Login Admin
                </h1>

                <p>
                    Masuk untuk mengelola pengaduan
                    dan pesan masyarakat.
                </p>

            </div>


            <!-- FORM LOGIN -->
            <form id="loginForm">

                <div class="login-form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Masukkan username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="login-form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Masuk ke Admin
                    <span>→</span>
                </button>


                <p
                    id="loginStatus"
                    class="login-status"
                ></p>

            </form>


            <!-- KEMBALI -->
            <a
                href="index.html"
                class="back-home"
            >
                ← Kembali ke website
            </a>

        </div>

    </main>


    <!-- LOGIN SCRIPT -->
    <script>

        const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycby2SshHN0YTUdKkvCnsULps6WO3jkhNK8LHqG2dEwd4xGqXHVGG_J0XFob5pUgkycSd/exec";


        const loginForm =
        document.getElementById("loginForm");

        const loginStatus =
        document.getElementById("loginStatus");


        loginForm.addEventListener(
            "submit",
            async function(e){

                e.preventDefault();


                const username =
                document.getElementById("username")
                .value
                .trim();


                const password =
                document.getElementById("password")
                .value
                .trim();


                if(!username || !password){

                    loginStatus.textContent =
                    "Username dan password wajib diisi.";

                    loginStatus.className =
                    "login-status error";

                    return;

                }


                loginStatus.textContent =
                "Memeriksa login...";

                loginStatus.className =
                "login-status";


                const data =
                new URLSearchParams();


                data.append(
                    "action",
                    "login"
                );


                data.append(
                    "username",
                    username
                );


                data.append(
                    "password",
                    password
                );


                try{

                    /*
                     * Login dilakukan melalui
                     * Google Apps Script.
                     */

                    const response =
                    await fetch(
                        SCRIPT_URL,
                        {
                            method:"POST",
                            body:data
                        }
                    );


                    const result =
                    await response.json();


                    if(result.success){

                        /*
                         * Simpan status login
                         * di browser.
                         */

                        sessionStorage.setItem(
                            "adminLogin",
                            "true"
                        );


                        sessionStorage.setItem(
                            "adminUsername",
                            username
                        );


                        loginStatus.textContent =
                        "Login berhasil. Membuka admin...";


                        loginStatus.className =
                        "login-status success";


                        setTimeout(
                            function(){

                                window.location.href =
                                "admin.html";

                            },
                            700
                        );


                    }else{

                        loginStatus.textContent =
                        result.message ||
                        "Username atau password salah.";

                        loginStatus.className =
                        "login-status error";

                    }


                }catch(error){

                    console.error(error);


                    loginStatus.textContent =
                    "Terjadi kesalahan koneksi. Coba lagi.";

                    loginStatus.className =
                    "login-status error";

                }

            }
        );

    </script>

</body>
</html>
